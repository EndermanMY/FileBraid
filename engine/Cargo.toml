[package]
name = "cardhelper-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
blake3 = { version = "1", features = ["pure"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
